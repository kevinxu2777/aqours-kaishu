<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
:root{--bg:#eef6fa;--card:#fff;--ink:#12303f;--sub:#527184;--line:#d3e4ec;--acc:#0079b8;--acc-ink:#fff;--track:#dcebf2;--water:#bfe4f5;--water2:#93d2ee;--orange:#d85c00}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Hiragino Sans","PingFang SC","Noto Sans JP","Noto Sans SC",system-ui,sans-serif;font-variant-numeric:tabular-nums}
main,header>div{max-width:820px;margin:0 auto;padding:0 16px}
header{border-bottom:1px solid var(--line)}
header>div{display:flex;justify-content:space-between;align-items:center;height:52px}
header a{font-weight:700;color:var(--acc);text-decoration:none;letter-spacing:.04em}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
h1{font-size:30px;margin:28px 0 4px;line-height:1.25}
h2{font-size:16px;margin:28px 0 10px}
.lead,.note{color:var(--sub);margin:0}.note{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.hero{position:relative;margin:18px 0 14px;padding:22px 22px 24px;display:flex;flex-wrap:wrap;gap:16px 36px;align-items:flex-end;min-height:150px}
.hero>*{position:relative}
.sea{position:absolute!important;inset:auto 0 0 0;transition:height .8s cubic-bezier(.2,.7,.2,1);background:linear-gradient(var(--water),var(--water2))}

.big{font-size:52px;font-weight:700;line-height:1;color:var(--acc)}

.hero .main{flex:1 1 220px}

.row{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin:10px 0}

.meta{font-size:12px;color:var(--sub);text-align:right;white-space:nowrap}
.bar{width:74px;height:6px;border-radius:9px;background:var(--track);overflow:hidden;flex:none}.bar i{display:block;height:100%;background:var(--acc)}
.ct{width:62px;text-align:right;flex:none;color:var(--sub);font-size:13px}.ct b{color:var(--ink);font-size:15px}.got .ct b{color:var(--acc)}
.dots{display:inline-flex;flex:none;width:64px}.dots i{width:13px;height:13px;border-radius:50%;margin-right:-7px;border:1.5px solid var(--card)}

.mem{display:inline-block;margin-right:10px;white-space:nowrap;font-size:14px}
.ev{margin-bottom:12px;padding:14px 16px}.ev h3{margin:0;font-size:15px;line-height:1.45}.ev .sub{font-size:12px;color:var(--sub);margin-bottom:6px}

.sh{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;margin:5px 0}

.sh label:has(:checked){background:color-mix(in srgb,var(--acc) 13%,var(--card));border-color:var(--acc)}
.lk{border:0;background:none;color:var(--acc);text-decoration:underline;font-size:13px;padding:4px}
.setl{flex-basis:100%;margin:2px 0 8px;padding-left:34px;font-size:13px;color:var(--sub)}.setl b{font-weight:500;color:var(--ink)}.setl a{color:var(--ink)}
.empty{border:1px dashed var(--line);border-radius:12px;padding:16px;color:var(--sub);margin:10px 0;font-size:14px}
.banner{background:var(--orange);color:var(--bg);padding:10px 16px;border-radius:12px;margin-top:16px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.banner .grow{flex:1 1 200px}
.yes{color:var(--acc);font-weight:700}footer{margin:40px 0;font-size:12px;color:var(--sub)}footer a{color:inherit}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);max-width:92vw;width:460px}
textarea{width:100%;height:90px;font:12px monospace;background:var(--bg);color:inherit;border:1px solid var(--line);border-radius:8px}
@media(max-width:560px){.li{padding:10px 12px;gap:8px}.bar{display:none}.dots{width:48px}.dots i{margin-right:-8.5px}.tabs button{padding:10px 10px}.hero{padding:18px}.ct{width:52px}.meta{font-size:11px;max-width:80px;white-space:normal}}
@media(prefers-reduced-motion:reduce){.sea{transition:none}}

<script>
const D=/*DATA*/;
const M=[['高海千歌','千歌','#FF9547'],['桜内梨子','梨子','#FF9EAC'],['松浦果南','果南','#27C1B7'],['黒澤ダイヤ','ダイヤ','#DB0839'],['渡辺 曜','曜','#66C0FF'],['津島善子','善子','#A6B1BC'],['国木田花丸','花丸','#FFD010'],['小原鞠莉','鞠莉','#C252C6'],['黒澤ルビィ','ルビィ','#FF6FBE']];
const T={zh:{title:'Aqours 回收率',lead:'勾选去过的公演，看看演过的曲子里你现场看到了多少。记录保存在这个浏览器里。',got:'回收曲目',att:'参加公演',tot:'观看曲数（累计）',rate:'回收率',solo:'Aqours 系公演',all:'含合同·音乐节',noOnline:'排除线上公演',ver:'改编版算不同曲',nonorig:'计入非原编制演出',short:'计入短版·串烧',post:'发到 X',share:'复制分享链接',backup:'备份 / 恢复',bySong:'按曲目',byMem:'按成员',shows:'参加的公演',g:{aqours:'全体曲',cyaron:'CYaRon!',azalea:'AZALEA',gk:'Guilty Kiss',mini:'小队·其他',solo:'Solo',yohane:'幻日夜羽'},st:['全部状态','未回收','已回收','有没看过的编制','从未演出'],so:['观看次数 多→少','观看次数 少→多','发售顺序'],hint:'在「参加的公演」里勾选去过的场次，这里就会显示观看次数。',songs:'首',form:'编制',exc:'已排除',never:'未演出',search:'搜索曲名',mode:['公演数','曲数'],times:'次',note:'小宫有纱（ダイヤ）中途退场，具体哪几首不明，歌单按九人计',msort:['成员顺序','数量 多→少'],mnote:['你在多少场公演里看到了这位成员唱歌。','你在现场看这位成员唱过多少首曲子。'],kinds:{live:'Live',fan:'Fan Meeting·活动',joint:'合同·音乐节'},set:n=>'歌单 '+n+' 首',noset:'歌单待更新',soon:'未举行',back:'← 返回',seen:'观看次数',perf:'场',forms:'各编制',plist:'演出过的公演',y:'看过',n:'没看',rel:'发售',copied:'已复制',viewing:'正在查看别人分享的记录',imp:'导入为我的记录',exit:'回到我的记录',conf:'将覆盖你现在的记录，确定吗？',bk:'复制下面的文字可备份；粘贴后点恢复。',restore:'恢复',close:'关闭',bad:'格式不对',none:'没有符合条件的曲目',orig:'原编制',from:'起',allev:'全部选择',clear:'清空全选',
foot:'非官方粉丝制作。歌单数据来自 <a href="https://love-live.fandom.com/">Love Live! Wiki</a>（CC BY-SA），BML 2019 参考 <a href="https://www.setlist.fm/setlist/aqours/2019/mercedes-benz-arena-shanghai-china-134db9ad.html">setlist.fm</a>，可能有误；成员临时缺席仅部分反映。只统计 Aqours 系列曲目，纯器乐串场不计。'},
ja:{title:'Aqours 回収率',lead:'参加した公演を選ぶと、披露された曲のうち現地で観た曲がわかります。記録はこのブラウザに保存されます。',got:'回収した曲',att:'参加した公演',tot:'観た曲（延べ）',rate:'回収率',solo:'Aqours の公演',all:'合同・フェスも',noOnline:'オンライン公演を除く',ver:'アレンジ違いを別の曲にする',nonorig:'オリメン以外の披露も数える',short:'ショート版・メドレーも数える',post:'X に投稿',share:'共有リンクをコピー',backup:'バックアップ',bySong:'曲ごと',byMem:'メンバーごと',shows:'参加した公演',g:{aqours:'全体曲',cyaron:'CYaRon!',azalea:'AZALEA',gk:'Guilty Kiss',mini:'ミニユニット・他',solo:'ソロ',yohane:'幻日のヨハネ'},st:['すべて','未回収','回収済み','観ていない編成がある','未披露'],so:['観た回数が多い順','観た回数が少ない順','発売順'],hint:'「参加した公演」で公演を選ぶと、ここに観た回数が出ます。',songs:'曲',form:'編成',exc:'除外',never:'未披露',search:'曲名で検索',mode:['公演数','曲数'],times:'回',note:'小宮有紗（ダイヤ）途中退席。曲単位は不明のため9人で集計',msort:['メンバー順','多い順'],mnote:['そのメンバーの歌を現地で観た公演の数です。','そのメンバーが現地で歌うのを観た曲の数です。'],kinds:{live:'ライブ',fan:'ファンミ・イベント',joint:'合同・フェス'},set:n=>'セトリ '+n+' 曲',noset:'セトリ未登録',soon:'開催前',back:'← 戻る',seen:'現地で観た回数',perf:'公演',forms:'編成ごと',plist:'披露した公演',y:'観た',n:'観ていない',rel:'発売',copied:'コピーしました',viewing:'共有された記録を表示中',imp:'自分の記録に取り込む',exit:'自分の記録に戻る',conf:'今の記録を上書きします。よろしいですか？',bk:'下の文字列を保存してください。貼り付けて復元できます。',restore:'復元',close:'閉じる',bad:'形式が正しくありません',none:'該当する曲がありません',orig:'オリメン',from:'から',allev:'全部選ぶ',clear:'全部外す',
foot:'非公式のファンサイトです。セトリは <a href="https://love-live.fandom.com/">Love Live! Wiki</a>（CC BY-SA）、BML 2019 は <a href="https://www.setlist.fm/setlist/aqours/2019/mercedes-benz-arena-shanghai-china-134db9ad.html">setlist.fm</a> によります。誤りを含むことがあり、欠席は一部のみ反映。Aqours 関連曲のみ集計し、インストは除きます。'}};
const KEY='aqours-kaishu';
let S={att:[],all:true,v2:1,noOnline:false,ver:false,nonorig:true,short:true,lang:'zh'};
try{Object.assign(S,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
try{const o=JSON.parse(localStorage.getItem(KEY)||'null');if(o&&!o.v2)S.all=true}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let ui={tab:'songs',g:new Set,st:0,so:0,q:'',mode:0,msort:0,open:new Set},shared=null;
const SH=[];D.events.forEach(e=>e.shows.forEach(s=>{s.e=e;SH[s.id]=s}));
const today=(d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`)(new Date);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const enc=a=>{let b=Array(Math.ceil(SH.length/6)).fill(0);a.forEach(i=>b[i/6|0]|=1<<i%6);return b.map(x=>'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_'[x]).join('').replace(/A+$/,'')||'A'};
const dec=s=>{let r=[];[...s].forEach((c,k)=>{let x='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_'.indexOf(c);for(let j=0;j<6;j++)if(x>>j&1&&SH[k*6+j])r.push(k*6+j)});return r};
const att=()=>new Set(shared||S.att);
function inScope(s){return(S.all||s.e.kind!='joint')&&!(S.noOnline&&s.e.online)&&s.date<=today}
const isOrig=(s,p)=>p.m==s.o||(s.id=='omoiyohitotsuninare'&&p.m=='012345678')||s.id=='omoiyohitotsuninare'&&p.m==s.o;
function calc(){
 const A=att(),by={},R={};
 D.songs.forEach(s=>by[s.id]=s);
 const get=(s,v)=>{const k=s.id+(v?'~'+v:'');return R[k]||(R[k]={k,s,v,ps:new Map,ex:new Set,raw:0})};
 D.songs.forEach(s=>get(s,''));
 SH.forEach(sh=>{if(!inScope(sh))return;sh.set.forEach(p=>{const s=by[p.s],r=get(s,S.ver&&p.v||'');
  if((!S.nonorig&&!isOrig(s,p))||(!S.short&&p.short)){r.ex.add(sh.id);return}
  if(!r.ps.has(sh.id))r.ps.set(sh.id,[]);r.ps.get(sh.id).push(p)})});
 const rows=Object.values(R).map(r=>{const F=new Map;let seen=0;
  r.ps.forEach((ps,id)=>{if(A.has(id))seen++;new Set(ps.map(p=>p.m)).forEach(m=>{const f=F.get(m)||{m,n:0,seen:0,d:'9'};f.n++;if(A.has(id))f.seen++;if(SH[id].date<f.d)f.d=SH[id].date;F.set(m,f)})});
  r.ps.forEach((_,id)=>r.ex.delete(id));
  return Object.assign(r,{n:r.ps.size,seen,F:[...F.values()].sort((a,b)=>a.d<b.d?-1:1)})});
 const perf=rows.filter(r=>r.n),got=perf.filter(r=>r.seen);
 const shows=SH.filter(s=>A.has(s.id)&&inScope(s));
 return{rows,perf:perf.length,got:got.length,att:shows.length,tot:got.reduce((a,r)=>a+r.seen,0)}}
const L=()=>T[S.lang];
const dots=m=>{const l=m.length>6&&m.length==9?'012345678':m;return`<span class="dots" aria-hidden="true">${[...l].map(i=>`<i style="background:${M[i][2]}"></i>`).join('')}</span>`};
const mems=m=>[...m].map(i=>`<span class="mem"><i class="dot" style="background:${M[i][2]}"></i>${M[i][1]}</span>`).join('');
const cnt=(a,u)=>`<span class="ct"><b>${a}</b> ${u}</span>`;
const WD={zh:'日一二三四五六',ja:'日月火水木金土'};
const fd=d=>d.length<9?d.replace('-','/'):d.replace(/-/g,'/')+`（${WD[S.lang][new Date(d+'T12:00').getDay()]}）`;
const songName=r=>esc(r.s.t)+(r.v?` <small>${esc(r.v)}</small>`:'');
const vis=()=>D.events.filter(e=>(S.all||e.kind!='joint')&&!(S.noOnline&&e.online)).sort((a,b)=>a.shows.reduce((m,s)=>s.date>m?s.date:m,'')<b.shows.reduce((m,s)=>s.date>m?s.date:m,'')?1:-1);
function head(c){const t=L(),p=c.perf?c.got/c.perf*100:0;
 return`<h1>${t.title}</h1><p class="lead">${t.lead}</p>
 <div class="card hero"><div class="sea" style="height:${p?Math.max(6,p*.93):0}%"><svg viewBox="0 0 800 10" preserveAspectRatio="none"><path d="M0 10V5Q50 0 100 5T200 5T300 5T400 5T500 5T600 5T700 5T800 5V10Z"/></svg></div>
 <div class="main"><div>${t.got}</div><div class="big">${c.got} <small>/ ${c.perf} ${t.songs}</small></div></div>
 <div class="kv"><div><span>${t.att}</span><b>${c.att}</b></div><div><span>${t.tot}</span><b>${c.tot}</b></div><div><span>${t.rate}</span><b>${p.toFixed(1).replace('.0','')}%</b></div></div></div>
 <div class="row"><span class="seg"><button data-a="all:0" aria-pressed="${!S.all}">${t.solo}</button><button data-a="all:1" aria-pressed="${S.all}">${t.all}</button></span>
 ${['noOnline','ver','nonorig','short'].map(k=>`<label class="ck"><input type="checkbox" data-c="${k}" ${S[k]?'checked':''}>${t[k]}</label>`).join('')}</div>
 <div class="row"><a class="btn p" target="_blank" rel="noopener" href="https://x.com/intent/post?text=${encodeURIComponent(`Aqours 回収率 ${p.toFixed(1)}%（${c.got} / ${c.perf} ${t.songs}・${c.att} ${t.perf}）\n#Aqours #lovelive`)}">${t.post}</a><button class="btn" data-a="share">${t.share}</button><button class="btn" data-a="backup">${t.backup}</button></div>`}
function filt(c){const t=L();let r=c.rows.filter(r=>!ui.g.size||ui.g.has(r.s.g));const q=ui.q.trim().toLowerCase();
 if(q)r=r.filter(x=>(x.s.t+' '+x.s.r).toLowerCase().includes(q));
 r=r.filter(x=>[1,x.n&&!x.seen,x.seen,x.n&&x.F.some(f=>!f.seen),!x.n][ui.st]);
 const cmp=[(a,b)=>b.seen-a.seen||!a.n-!b.n||(a.s.d<b.s.d?-1:1),(a,b)=>!a.n-!b.n||a.seen-b.seen||(a.s.d<b.s.d?-1:1),(a,b)=>a.s.d<b.s.d?-1:a.s.d>b.s.d?1:0][ui.so];
 return r.sort(cmp)}
function songList(c){const t=L(),r=filt(c);return`<p class="note">${r.length} ${t.songs}</p>`+(r.length?`<div class="card">${r.map(x=>`<a class="li ${x.seen?'got':''}" href="#song/${encodeURIComponent(x.k)}">${dots(x.s.o)}<span class="nm">${songName(x)}</span><span class="meta">${x.F.length>1?`${t.form} ${x.F.filter(f=>f.seen).length}/${x.F.length} `:''}</span>${x.n?cnt(x.seen,t.times):`<span class="meta">${t.never}</span>`}</a>`).join('')}</div>`:`<div class="empty">${t.none}</div>`)}
function tabSongs(c){const t=L();return`<div class="chips">${Object.entries(t.g).map(([k,v])=>`<button data-a="g:${k}" aria-pressed="${ui.g.has(k)}">${v}</button>`).join('')}</div>
 <div class="row"><select data-s="st">${t.st.map((x,i)=>`<option value="${i}" ${ui.st==i?'selected':''}>${x}</option>`).join('')}</select><select data-s="so">${t.so.map((x,i)=>`<option value="${i}" ${ui.so==i?'selected':''}>${x}</option>`).join('')}</select><input type="search" id="q" placeholder="${t.search}" aria-label="${t.search}" value="${esc(ui.q)}"></div>
 ${c.att?'':`<div class="empty">${t.hint}</div>`}<div id="list">${songList(c)}</div>`}
